quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.username=spongecoach
%dev.quarkus.datasource.password=spongecoach
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/spongecoach

%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

spongecoach.anthropic.api-key=${ANTHROPIC_API_KEY:}
spongecoach.anthropic.model=claude-opus-5

# Up to 12 downscaled sketch photos in one upload (ADR-0018).
quarkus.http.limits.max-body-size=25M

# Loads the example Drills from docs/drills/examples on startup (ADR-0018).
%dev.spongecoach.drills.seed-examples=true
